<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自強高工 - 校車路線規劃地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f8fafc;
      color: #1e293b;
      position: relative;
    }

    aside {
      width: 340px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.06);
      transition: margin-left 0.3s ease;
      flex-shrink: 0;
    }

    body.sidebar-closed aside {
      margin-left: -340px;
    }

    .toggle-sidebar-btn {
      position: absolute;
      top: 50%;
      left: 340px;
      transform: translateY(-50%);
      z-index: 1001;
      background: #1e3a8a;
      color: white;
      border: none;
      width: 24px;
      height: 60px;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 0 6px rgba(0,0,0,0.2);
      transition: left 0.3s ease, background 0.2s;
      font-size: 12px;
    }
    .toggle-sidebar-btn:hover { background: #2563eb; }
    body.sidebar-closed .toggle-sidebar-btn { left: 0; }
    body.sidebar-closed .toggle-sidebar-btn::after { content: "▶"; }
    .toggle-sidebar-btn::after { content: "◀"; }

    .sidebar-header {
      padding: 20px 20px 16px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
    }
    .sidebar-header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.04em; }
    .sidebar-header p { font-size: 0.9rem; opacity: 0.9; margin-top: 4px; }

    .toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #f8fafc;
    }
    .btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #f1f5f9; }
    .btn.active { background: #2563eb; color: #ffffff; border-color: #2563eb; }
    .btn-download { background: #10b981; color: #ffffff; border-color: #10b981; }
    .btn-download:hover { background: #059669; }

    .route-list { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .route-card {
      border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px;
      background: #ffffff; overflow: hidden;
    }
    .route-card.selected { border-color: #2563eb; box-shadow: 0 2px 10px rgba(37, 99, 235, 0.12); }
    .route-title-btn {
      width: 100%; padding: 12px 14px; background: none; border: none;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; font-size: 0.98rem; font-weight: 700; color: #0f172a;
    }
    .route-badge { display: inline-flex; align-items: center; gap: 8px; }
    .color-dot { width: 12px; height: 12px; border-radius: 50%; }
    .route-meta { font-size: 0.78rem; color: #64748b; font-weight: 400; }
    
    .stop-list { border-top: 1px solid #f1f5f9; padding: 8px 14px 12px; background: #fafafa; display: none; }
    .route-card.selected .stop-list { display: block; }
    .stop-item {
      display: flex; align-items: center; gap: 10px; padding: 6px 8px;
      font-size: 0.88rem; color: #334155;
    }
    .stop-num {
      width: 20px; height: 20px; border-radius: 50%; font-size: 0.75rem;
      font-weight: 700; color: #fff; display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stop-time { margin-left: auto; font-size: 0.78rem; color: #64748b; }

    main { flex: 1; position: relative; height: 100%; min-width: 0; }
    #map { width: 100%; height: 100%; background: #e2e8f0; }

    .sidebar-footer { padding: 12px 16px; font-size: 0.78rem; color: #64748b; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    
    .map-label {
      border: 1px solid #94a3b8;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      font-weight: bold;
      font-size: 13px; 
      padding: 3px 6px;
      white-space: nowrap;
      color: #0f172a;
    }

    .export-mode {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 2560px !important;  
      height: 1440px !important;
      z-index: 9999; 
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>自強高工</h1>
      <p>校車路線規劃地圖</p>
    </div>

    <div class="toolbar">
      <button id="btnShowAll" class="btn active" type="button">全部路線</button>
      <!-- <button id="btnPicker" class="btn" type="button" title="開啟後點擊地圖可複製經緯度">📍 取座標</button> -->
      <button id="btnDownload" class="btn btn-download" type="button">📥 高清截圖</button>
    </div>

    <div id="routeList" class="route-list"></div>

    <div class="sidebar-footer">
      * 路線為系統自動計算之最短行車路徑。<br />
      * 點擊高清截圖，將擷取 2K 畫質廣角地圖。
    </div>
  </aside>

  <button id="btnToggleSidebar" class="toggle-sidebar-btn" title="收起/展開側邊欄"></button>

  <main id="mapContainer">
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- 載入路線資料 -->
  <script src="routes.js"></script>

  <script>
    const CONFIG = {
      school: { name: "自強高工", address: "新竹縣竹東鎮自強路169號", coords: [24.7478, 121.0883] }
    };

    // 自動依據 routes.js 內的 bgColor 與 color 產生標籤樣式
    const styleEl = document.createElement('style');
    let dynamicCss = '';
    BUS_ROUTES.forEach(route => {
        if (route.bgColor) {
            dynamicCss += `
              .label-${route.id} {
                  background-color: ${route.bgColor} !important;
                  border-color: ${route.color} !important;
              }
              .label-${route.id}.leaflet-tooltip-left::before { border-left-color: ${route.bgColor} !important; }
              .label-${route.id}.leaflet-tooltip-right::before { border-right-color: ${route.bgColor} !important; }
              .label-${route.id}.leaflet-tooltip-top::before { border-top-color: ${route.bgColor} !important; }
              .label-${route.id}.leaflet-tooltip-bottom::before { border-bottom-color: ${route.bgColor} !important; }
            `;
        }
    });
    styleEl.innerHTML = dynamicCss;
    document.head.appendChild(styleEl);

    let currentRouteId = null;
    const map = L.map("map", { preferCanvas: true }).setView(CONFIG.school.coords, 12);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap',
      crossOrigin: true
    }).addTo(map);

    const schoolIcon = L.divIcon({
      className: "school-pin",
      html: `<div style="background:#1e3a8a;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);transform:translate(-35%,-50%);">🏫 ${CONFIG.school.name}</div>`,
      iconSize: [0, 0]
    });
    L.marker(CONFIG.school.coords, { icon: schoolIcon, zIndexOffset: 1000 }).addTo(map);

    const routeLayers = {};
    const routeListEl = document.getElementById("routeList");
    const btnShowAll = document.getElementById("btnShowAll");
    const btnPicker = document.getElementById("btnPicker");
    const btnDownload = document.getElementById("btnDownload");
    const btnToggleSidebar = document.getElementById("btnToggleSidebar");
    let pickerMode = false;

    btnToggleSidebar.addEventListener("click", () => {
      document.body.classList.toggle("sidebar-closed");
      setTimeout(() => map.invalidateSize(), 300);
    });

    BUS_ROUTES.forEach((route) => {
      const layerGroup = L.layerGroup().addTo(map);
      
      const bounds = L.latLngBounds(route.stops.map(s => s.coords));
      bounds.extend(CONFIG.school.coords);
      routeLayers[route.id] = { layerGroup, bounds };

      route.stops.forEach((stop, idx) => {
        L.circleMarker(stop.coords, {
          radius: 7, fillColor: route.color, color: "#ffffff", weight: 2.5, opacity: 1, fillOpacity: 1
        }).addTo(layerGroup).bindTooltip(stop.name, { 
            permanent: true, 
            direction: stop.direction || 'right',
            className: `map-label label-${route.id}`,
            offset: [0, 0]
        });
      });

      const coordinatesString = route.stops.map(s => `${s.coords[1]},${s.coords[0]}`).join(';');
      const schoolCoordString = `${CONFIG.school.coords[1]},${CONFIG.school.coords[0]}`;
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordinatesString};${schoolCoordString}?overview=full&geometries=geojson`;

      fetch(osrmUrl)
        .then(response => response.json())
        .then(data => {
          if (data.routes && data.routes.length > 0) {
            const realPath = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            L.polyline(realPath, { color: route.color, weight: 5, opacity: 0.85 }).addTo(layerGroup);
          } else {
            const allStops = [...route.stops.map(s => s.coords), CONFIG.school.coords];
            L.polyline(allStops, { color: route.color, weight: 5, opacity: 0.85 }).addTo(layerGroup);
          }
        })
        .catch(() => {
          const allStops = [...route.stops.map(s => s.coords), CONFIG.school.coords];
          L.polyline(allStops, { color: route.color, weight: 5, opacity: 0.85 }).addTo(layerGroup);
        });

      const card = document.createElement("div");
      card.className = "route-card";
      card.dataset.id = route.id;
      
      card.innerHTML = `
        <button class="route-title-btn" type="button">
          <span class="route-badge"><span class="color-dot" style="background:${route.color}"></span><span>${route.name}</span></span>
          <span class="route-meta">${route.note}</span>
        </button>
        <div class="stop-list">
          ${route.stops.map((stop, idx) => `
            <div class="stop-item">
              <span class="stop-num" style="background:${route.color}">${idx + 1}</span>
              <span>${stop.name.replace(/<br>/g, " ")}</span>
              <span class="stop-time">${stop.time}</span>
            </div>
          `).join('')}
        </div>
      `;
      card.querySelector('.route-title-btn').addEventListener("click", () => selectRoute(route.id));
      routeListEl.appendChild(card);
    });

    function selectRoute(routeId) {
      currentRouteId = routeId;
      btnShowAll.classList.remove("active");
      document.querySelectorAll(".route-card").forEach((card) => card.classList.toggle("selected", card.dataset.id === routeId));
      BUS_ROUTES.forEach((route) => {
        const { layerGroup, bounds } = routeLayers[route.id];
        if (route.id === routeId) {
          if (!map.hasLayer(layerGroup)) map.addLayer(layerGroup);
          map.fitBounds(bounds, { padding: [50, 50] });
        } else {
          if (map.hasLayer(layerGroup)) map.removeLayer(layerGroup);
        }
      });
    }

    btnShowAll.addEventListener("click", () => {
      currentRouteId = null;
      btnShowAll.classList.add("active");
      document.querySelectorAll(".route-card").forEach((c) => c.classList.remove("selected"));
      const allBounds = L.latLngBounds([]);
      BUS_ROUTES.forEach((route) => {
        const { layerGroup, bounds } = routeLayers[route.id];
        if (!map.hasLayer(layerGroup)) map.addLayer(layerGroup);
        allBounds.extend(bounds);
      });
      if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [40, 40] });
    });
    
    btnPicker.addEventListener("click", () => {
      pickerMode = !pickerMode;
      btnPicker.classList.toggle("active", pickerMode);
      map.getContainer().style.cursor = pickerMode ? "crosshair" : "";
    });

    map.on("click", (e) => {
      if (!pickerMode) return;
      const lat = e.latlng.lat.toFixed(4);
      const lng = e.latlng.lng.toFixed(4);
      const coordText = `[${lat}, ${lng}]`;
      L.popup()
        .setLatLng(e.latlng)
        .setContent(`
          <div style="text-align:center;">
            <div style="font-size:12px;color:#64748b;">點擊複製此座標貼回程式碼：</div>
            <code style="display:block;margin:6px 0;padding:4px 8px;background:#f1f5f9;border-radius:4px;font-weight:700;">${coordText}</code>
            <button onclick="navigator.clipboard.writeText('${coordText}');this.textContent='已複製！'" style="padding:4px 10px;border:none;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer;font-size:12px;">複製座標</button>
          </div>
        `)
        .openOn(map);
    });

    btnDownload.addEventListener("click", () => {
      const originalText = btnDownload.innerText;
      btnDownload.innerText = "⏳ 處理中(勿操作)...";
      
      const mapEl = document.getElementById("mapContainer");
      
      mapEl.classList.add("export-mode");
      map.invalidateSize(); 
      
      let targetBounds = L.latLngBounds([]);
      if (currentRouteId) {
          targetBounds = routeLayers[currentRouteId].bounds;
      } else {
          BUS_ROUTES.forEach(r => targetBounds.extend(routeLayers[r.id].bounds));
      }
      map.fitBounds(targetBounds, { padding: [150, 150] });

      setTimeout(() => {
        html2canvas(mapEl, {
          useCORS: true,
          allowTaint: false,
          ignoreElements: (element) => {
            return element.classList && element.classList.contains("leaflet-control-zoom");
          }
        }).then((canvas) => {
          const link = document.createElement("a");
          link.download = "校車路線規劃地圖_高清廣角.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          
          mapEl.classList.remove("export-mode");
          map.invalidateSize();
          map.fitBounds(targetBounds, { padding: [40, 40] });
          btnDownload.innerText = originalText;
        }).catch(err => {
          console.error(err);
          alert("圖片產生失敗，請稍後再試。");
          mapEl.classList.remove("export-mode");
          map.invalidateSize();
          btnDownload.innerText = originalText;
        });
      }, 1500); 
    });

    btnShowAll.click();
  </script>
</body>
</html>
